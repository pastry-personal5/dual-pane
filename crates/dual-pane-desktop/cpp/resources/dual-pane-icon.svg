<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8F3FF"/>
      <stop offset="0.48" stop-color="#9DD7F5"/>
      <stop offset="1" stop-color="#62A9E2"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F2FAFF" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2D78AE" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#background)"/>

  <g filter="url(#shadow)">
    <rect x="218" y="218" width="252" height="588" rx="82" fill="url(#pane)"/>
    <rect x="554" y="218" width="252" height="588" rx="82" fill="url(#pane)"/>
  </g>

  <rect x="500" y="278" width="24" height="468" rx="12" fill="#3D8FC6" fill-opacity="0.32"/>
</svg>
