[workspace]
members = ["crates/dual-pane-adapters", "crates/dual-pane-application", "crates/dual-pane-desktop", "crates/dual-pane-domain"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
dual-pane-adapters = { path = "crates/dual-pane-adapters" }
dual-pane-application = { path = "crates/dual-pane-application" }
dual-pane-domain = { path = "crates/dual-pane-domain" }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
unicode-normalization = "=0.1.25"
